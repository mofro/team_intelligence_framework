name: Deploy Application

on:
  push:
    branches:
      - main # Change this to your main branch if different
  release:
    types: [published] # Trigger on release publication
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Set up Node.js (if applicable)
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'  # Specify your Node.js version if applicable

      # - name: Install dependencies (if applicable)
      #   run: |
      #     npm install  # Change this to your package manager if necessary

      - name: Create flat deployable directory
        run: |
          mkdir -p deploy
          # Flat layout: every file lands directly in deploy/. The five domain
          # context_configuration.json files share a name, so they are prefixed
          # with their domain. Any other name collision fails the build instead
          # of silently overwriting a file.
          copy_flat() {
            dest="deploy/$2"
            if [ -e "$dest" ]; then
              echo "::error::flat name collision: $1 -> $dest"
              exit 1
            fi
            cp "$1" "$dest"
          }
          find config -type f | while read -r f; do copy_flat "$f" "$(basename "$f")"; done
          find personas -type f | while read -r f; do
            name="$(basename "$f")"
            if [ "$name" = "context_configuration.json" ]; then
              name="$(echo "$f" | cut -d/ -f2)_$name"
            fi
            copy_flat "$f" "$name"
          done
          cp README.md deploy/ || true
          cp USER_GUIDE.md deploy/ || true
          cp Persona_Framework_Implementation_Guide.md deploy/ || true

      - name: Zip deployable directory
        run: |
          cd deploy
          zip -r ../deployable.zip .  # Create a zip file of the deployable directory

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployable-artifact
          path: deployable.zip