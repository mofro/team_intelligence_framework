name: Persona index

on:
  pull_request:
  push:
    branches: [main]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s scripts
      - name: Plugin tests
        run: python3 -m unittest discover -s plugin/scripts
      - name: Plugin docs match the command table
        run: python3 plugin/scripts/tif.py --check
      - name: index.json is current and catalog has no errors
        run: python3 scripts/build_persona_index.py --check
